# Spitfire for GitLab CI: hidden jobs to extend. .spitfire-load-test runs a
# saved load test as a gate; .spitfire-deploy (below) announces a deploy to
# the synthetic monitors; .spitfire-maintenance puts them in planned
# maintenance.
#
#   include:
#     - remote: https://raw.githubusercontent.com/usespitfire/spitfire-examples/main/ci/gitlab/spitfire.gitlab-ci.yml
#   load-test:
#     extends: .spitfire-load-test
#     variables:
#       SPITFIRE_URL: https://spitfire.example.com
#       SPITFIRE_TEST: "Checkout flow"
#
# SPITFIRE_TOKEN (Settings → CI/CD → Variables, masked): a personal API token
# from Spitfire (user menu → API tokens). For the merge request comment also
# SPITFIRE_GITLAB_TOKEN: a project access token with the api scope, masked.
#
# The CLI comes from your controller (always its version) and is checked
# against the SHA-256 the controller sends. The test runs on your Spitfire
# runners; the job fails when a threshold fails (exit 99; 97 aborted, 98 the
# candidate is worse in a comparison; 96 with SPITFIRE_FAIL_ON_REGRESSION, a
# step worse than the test's reference run).
.spitfire-load-test:
  image: alpine:3.20
  variables:
    SPITFIRE_URL: ""            # required: your controller
    SPITFIRE_TEST: ""           # required: the saved test's name or id
    SPITFIRE_ENVIRONMENT: ""    # one of the test's environments, e.g. staging
    SPITFIRE_RUNNERS: "1"
    SPITFIRE_REPORT_LANG: "en"  # en or tr
    SPITFIRE_MR_COMMENT: "auto" # true, false, or auto (in merge request pipelines)
    SPITFIRE_FAIL_ON_REGRESSION: "false" # true: exit 96 when a step is worse than the test's reference run (Spitfire 1.4.2+)
    SPITFIRE_EXTRA_ARGS: ""     # any other `spitfire cloud run` flags, e.g. --compare A=prod,B=staging
  script:
    - |
      set -eu
      [ -n "$SPITFIRE_URL" ] && [ -n "$SPITFIRE_TEST" ] || { echo "set SPITFIRE_URL and SPITFIRE_TEST"; exit 1; }
      apk add --no-cache curl >/dev/null
      case "$(uname -m)" in
        x86_64) f=spitfire-cli-linux-amd64.gz ;;
        aarch64) f=spitfire-cli-linux-arm64.gz ;;
        *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
      esac
      want="$(curl -fsS -D - -o "/tmp/$f" "${SPITFIRE_URL%/}/api/v1/runner-dist/$f" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-content-sha256"{print $2}')"
      got="$(sha256sum "/tmp/$f" | cut -d' ' -f1)"
      [ -n "$want" ] && [ "$want" = "$got" ] || { echo "the CLI from $SPITFIRE_URL does not match its checksum"; exit 1; }
      gunzip -c "/tmp/$f" > /usr/local/bin/spitfire && chmod +x /usr/local/bin/spitfire
      set -- cloud run "$SPITFIRE_TEST" -r "$SPITFIRE_RUNNERS" --report-lang "$SPITFIRE_REPORT_LANG" -o spitfire-summary.json --summary-md spitfire-summary.md
      [ -z "$SPITFIRE_ENVIRONMENT" ] || set -- "$@" --env "$SPITFIRE_ENVIRONMENT"
      [ "${SPITFIRE_FAIL_ON_REGRESSION:-false}" != true ] || set -- "$@" --fail-on-regression
      if [ "$SPITFIRE_MR_COMMENT" = true ] || { [ "$SPITFIRE_MR_COMMENT" = auto ] && [ "${CI_PIPELINE_SOURCE:-}" = merge_request_event ]; }; then
        set -- "$@" --pr-comment
      fi
      # shellcheck disable=SC2086
      spitfire "$@" $SPITFIRE_EXTRA_ARGS
  artifacts:
    when: always
    paths: [spitfire-summary.json, spitfire-summary.md]

# Announce a deploy to Spitfire's synthetic monitors: the monitors it touches
# check at once and then every minute for 30 minutes, and each gets a verdict
# for the deploy (clean, slower, failing more). Runs in .post, so only after
# every earlier job, your deploy too, succeeded:
#
#   announce-deploy:
#     extends: .spitfire-deploy
#     variables:
#       SPITFIRE_URL: https://spitfire.example.com
#       SPITFIRE_ENVIRONMENT: prod
#     rules:
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#
# Or at the end of your own deploy job (an image with curl or apk), with
# SPITFIRE_URL and the others set on that job:
#   script:
#     - ./deploy.sh
#     - !reference [.spitfire-deploy, script]
#
# Later jobs get SPITFIRE_DEPLOY_ID and SPITFIRE_DEPLOY_WOKEN (a dotenv report).
.spitfire-deploy:
  image: alpine:3.20
  stage: .post
  variables:
    SPITFIRE_URL: ""              # required: your controller
    SPITFIRE_ENVIRONMENT: ""      # wake this environment's monitors
    SPITFIRE_DEPLOY_VERSION: ""   # shown on the monitors' trend (default the short commit SHA)
    SPITFIRE_DEPLOY_NOTE: ""      # a short note (default the project's path)
    SPITFIRE_DEPLOY_MONITORS: ""  # monitor ids, comma separated (default the environment's, or all you may change)
    SPITFIRE_INSECURE: "false"    # true: a test controller with a self-signed certificate only
  script:
    - |
      set -eu
      url="${SPITFIRE_URL:-}"; env="${SPITFIRE_ENVIRONMENT:-}"; mons="${SPITFIRE_DEPLOY_MONITORS:-}"
      version="${SPITFIRE_DEPLOY_VERSION:-${CI_COMMIT_SHORT_SHA:-}}"; note="${SPITFIRE_DEPLOY_NOTE:-${CI_PROJECT_PATH:-}}"
      [ -n "$url" ] || { echo "set SPITFIRE_URL"; exit 1; }
      [ -n "${SPITFIRE_TOKEN:-}" ] || { echo "set SPITFIRE_TOKEN (Settings → CI/CD → Variables, masked)"; exit 1; }
      command -v curl >/dev/null || apk add --no-cache curl >/dev/null
      # JSON strings by hand: no jq needed
      js() { printf '"%s"' "$(printf '%s' "$1" | tr '\n\r\t' '   ' | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
      ids=""
      for m in $(echo "$mons" | tr ',' ' '); do ids="${ids:+$ids,}$(js "$m")"; done
      body="{\"environment\":$(js "$env"),\"version\":$(js "$version"),\"note\":$(js "$note")${ids:+,\"monitors\":[$ids]}}"
      k=""; [ "${SPITFIRE_INSECURE:-false}" = true ] && k="-k"
      out="$(mktemp)"
      code="$(curl -sS $k -o "$out" -w '%{http_code}' -X POST "${url%/}/api/v1/deploys" \
        -H "Authorization: Bearer $SPITFIRE_TOKEN" -H "Content-Type: application/json" --data "$body")" || code=000
      case "$code" in 200|201|202) ;; *) echo "the deploy could not be announced (HTTP $code): $(head -c 300 "$out" 2>/dev/null)"; exit 1 ;; esac
      id="$(grep -o '"id":"[^"]*"' "$out" | head -1 | cut -d'"' -f4 || true)"
      woken="$(sed -n 's/.*"woken":\[\([^]]*\)\].*/\1/p' "$out" | { grep -o '"id":' || true; } | wc -l | tr -d ' ')"
      printf 'SPITFIRE_DEPLOY_ID=%s\nSPITFIRE_DEPLOY_WOKEN=%s\n' "$id" "${woken:-0}" > spitfire-deploy.env
      echo "Spitfire: deploy $version announced; ${woken:-0} monitor(s) on close watch for 30 minutes."
  artifacts:
    reports:
      dotenv: spitfire-deploy.env

# Planned maintenance (Spitfire 0.51+): the monitors' checks are skipped (and
# left out of uptime, SLO and deploy verdicts) and nothing alerts until it
# ends. SPITFIRE_MAINTENANCE is minutes (1-1440) to start it, or end to end it
# (the monitors check at once). Quiet them before a deploy with downtime, end
# it after:
#
#   maintenance-start:
#     extends: .spitfire-maintenance
#     stage: deploy
#     variables:
#       SPITFIRE_URL: https://spitfire.example.com
#       SPITFIRE_ENVIRONMENT: prod
#       SPITFIRE_MAINTENANCE: "30"
#       SPITFIRE_MAINTENANCE_NOTE: database migration
#   maintenance-end:
#     extends: .spitfire-maintenance
#     stage: .post
#     when: always
#     variables:
#       SPITFIRE_URL: https://spitfire.example.com
#       SPITFIRE_ENVIRONMENT: prod
#       SPITFIRE_MAINTENANCE: end
#
# Or in your own deploy job: - !reference [.spitfire-maintenance, script]
# Later jobs get SPITFIRE_MAINTENANCE_UNTIL (empty when ended).
.spitfire-maintenance:
  image: alpine:3.20
  variables:
    SPITFIRE_URL: ""              # required: your controller
    SPITFIRE_MAINTENANCE: ""      # required: minutes (1-1440), or end
    SPITFIRE_ENVIRONMENT: ""      # this environment's monitors
    SPITFIRE_MAINTENANCE_NOTE: "" # why, shown on the monitors' pages
    SPITFIRE_DEPLOY_MONITORS: ""  # monitor ids, comma separated (default the environment's, or all you may change)
    SPITFIRE_INSECURE: "false"    # true: a test controller with a self-signed certificate only
  script:
    - |
      set -eu
      url="${SPITFIRE_URL:-}"; env="${SPITFIRE_ENVIRONMENT:-}"; mons="${SPITFIRE_DEPLOY_MONITORS:-}"
      maint="${SPITFIRE_MAINTENANCE:-}"; note="${SPITFIRE_MAINTENANCE_NOTE:-}"
      [ -n "$url" ] || { echo "set SPITFIRE_URL"; exit 1; }
      [ -n "${SPITFIRE_TOKEN:-}" ] || { echo "set SPITFIRE_TOKEN (Settings → CI/CD → Variables, masked)"; exit 1; }
      case "$maint" in
        end) minutes=0 ;;
        ""|*[!0-9]*) echo "SPITFIRE_MAINTENANCE is a number of minutes (1-1440) or end, not '$maint'"; exit 1 ;;
        *) minutes=$(printf '%s' "$maint" | sed 's/^0*//'); minutes=${minutes:-0}
           [ "$minutes" -gt 0 ] || { echo "SPITFIRE_MAINTENANCE: give 1-1440 minutes, or end"; exit 1; } ;;
      esac
      command -v curl >/dev/null || apk add --no-cache curl >/dev/null
      js() { printf '"%s"' "$(printf '%s' "$1" | tr '\n\r\t' '   ' | sed 's/\\/\\\\/g; s/"/\\"/g')"; }
      ids=""
      for m in $(echo "$mons" | tr ',' ' '); do ids="${ids:+$ids,}$(js "$m")"; done
      body="{\"environment\":$(js "$env"),\"minutes\":$minutes,\"note\":$(js "$note")${ids:+,\"monitors\":[$ids]}}"
      k=""; [ "${SPITFIRE_INSECURE:-false}" = true ] && k="-k"
      out="$(mktemp)"
      code="$(curl -sS $k -o "$out" -w '%{http_code}' -X POST "${url%/}/api/v1/maintenance" \
        -H "Authorization: Bearer $SPITFIRE_TOKEN" -H "Content-Type: application/json" --data "$body")" || code=000
      [ "$code" = 200 ] || { echo "the maintenance could not be set (HTTP $code): $(head -c 300 "$out" 2>/dev/null)"; exit 1; }
      until="$(grep -o '"until":"[^"]*"' "$out" | head -1 | cut -d'"' -f4 || true)"
      n="$({ grep -o '"id":' "$out" || true; } | wc -l | tr -d ' ')"
      printf 'SPITFIRE_MAINTENANCE_UNTIL=%s\n' "$until" > spitfire-maintenance.env
      if [ "$minutes" -gt 0 ]; then echo "Spitfire: $n monitor(s) in planned maintenance until $until."
      else echo "Spitfire: planned maintenance ended for $n monitor(s); they check at once."; fi
  artifacts:
    reports:
      dotenv: spitfire-maintenance.env
